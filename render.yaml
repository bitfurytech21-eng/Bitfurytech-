services:
  - type: web
    name: bitfurytech
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SMTP_FROM
        value: "BitfuryTech Support <support@bitfurytech.cloud>"
