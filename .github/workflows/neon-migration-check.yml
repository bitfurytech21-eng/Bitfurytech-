name: Neon migration dependency and build verification

on:
  workflow_dispatch:
  push:
    branches: ["migration/neon-cutover"]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/neon-migration-check.yml"
      - "src/**"
      - "server.ts"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/neon-migration-check.yml"
      - "src/**"
      - "server.ts"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install exact committed dependency tree
        run: npm ci --no-audit --no-fund
      - name: Build production frontend
        run: npm run build
