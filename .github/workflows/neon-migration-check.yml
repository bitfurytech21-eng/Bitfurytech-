name: Neon migration dependency and build verification

on:
  workflow_dispatch:
  push:
    branches: ["migration/neon-cutover"]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/neon-migration-check.yml"
      - "src/**"
      - "server.ts"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/neon-migration-check.yml"
      - "src/**"
      - "server.ts"

permissions:
  contents: write

jobs:
  lockfile-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate package lock from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit repaired lockfile when changed
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate package lockfile"
            git push
          fi
      - name: Install exactly from lockfile
        run: npm ci
      - name: Build production frontend
        run: npm run build
