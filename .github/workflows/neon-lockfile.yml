name: Regenerate lockfile and verify migration branch

on:
  workflow_dispatch:
  push:
    branches:
      - migration/neon-cutover

# Prevent concurrent lockfile writers from racing and rejecting each other's pushes.
concurrency:
  group: neon-migration-lockfile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lockfile-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/neon-cutover
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate dependency lockfile [skip ci]"
            git fetch origin migration/neon-cutover
            git rebase origin/migration/neon-cutover
            git push origin HEAD:migration/neon-cutover
          fi

      - name: Verify clean install
        run: npm ci

      - name: Build production frontend
        run: npm run build
