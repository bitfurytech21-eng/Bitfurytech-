name: Verify npm lockfile and migration build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "fix/**"
      - migration/neon-cutover
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/neon-lockfile.yml"
      - "src/**"
      - "server.ts"
      - "render.yaml"

concurrency:
  group: npm-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Verify committed lockfile without modifying it
        run: npm ci --no-audit --no-fund
      - name: Type-check server and application TypeScript
        run: npx tsc --noEmit
      - name: Build production frontend
        run: npm run build
