name: Verify npm lockfile and migration build

on:
  workflow_dispatch:
  push:
    branches:
      - migration/neon-cutover

concurrency:
  group: neon-migration-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/neon-cutover
      - name: Set up Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Verify committed lockfile without modifying it
        run: npm ci --no-audit --no-fund
      - name: Build production frontend
        run: npm run build
